<!doctype html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BusinessOS</title><link rel="stylesheet" href="styles.css"></head>
<body><section id="authScreen" class="auth-screen"><div class="auth-card"><div class="brand auth-brand">Business<span>OS</span><small style="display:block;font-size:10px;letter-spacing:.4px;color:#b78b4a;font-weight:600;margin-top:3px">By NorthStar Agency</small></div><p class="muted">İşletmenizi tek panelden yönetin.</p><div class="auth-tabs"><button id="loginTab" class="active">Giriş yap</button><button id="signupTab">Kayıt ol</button></div><form id="authForm"><label>E-posta<input id="authEmail" type="email" required autocomplete="email"></label><label>Şifre<input id="authPassword" type="password" minlength="6" required autocomplete="current-password"></label><button id="authSubmit">Giriş yap</button></form><button id="forgotPassword" class="link-button">Şifremi unuttum</button><p id="authMessage" class="auth-message"></p></div></section><div id="appShell" class="shell" hidden><aside><div class="brand">Business<span>OS</span><small style="display:block;font-size:10px;letter-spacing:.4px;color:#b78b4a;font-weight:600;margin-top:3px">By NorthStar Agency</small></div><p class="muted" id="businessLabel">Örnek İşletme</p><nav><button data-view="dashboard" class="active">Genel Bakış</button><button data-view="transactions">Gelir & Gider</button><button data-view="customers">Müşteriler</button><button data-view="receivables">Tahsilatlar</button><button data-view="settings">Ayarlar</button></nav><small class="muted">Bulut çalışma alanı</small><button id="logoutBtn" class="secondary">Çıkış yap</button></aside><main><header><div><p class="eyebrow">BusinessOS / <span id="dateLabel"></span></p><h1 id="viewTitle">Genel Bakış</h1></div><button class="secondary" id="demoBtn">Demo verisi</button></header><section id="app"></section></main></div><div id="toast" role="status"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script><script src="auth.js"></script></body></html>
